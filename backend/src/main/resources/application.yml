spring:
  application:
    name: money-transfer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/money_transfer}
    username: ${SPRING_DATASOURCE_USERNAME:money_transfer}
    password: ${SPRING_DATASOURCE_PASSWORD:money_transfer_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

transfer:
  business-time-zone: ${BUSINESS_TIME_ZONE:Europe/Istanbul}
  limits:
    per-transfer: ${TRANSFER_LIMITS_PER_TRANSFER:50000.00}
    daily: ${TRANSFER_LIMITS_DAILY:100000.00}
    monthly: ${TRANSFER_LIMITS_MONTHLY:500000.00}

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
