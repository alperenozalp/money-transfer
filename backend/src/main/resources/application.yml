spring:
  application:
    name: money-transfer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/money_transfer}
    username: ${SPRING_DATASOURCE_USERNAME:money_transfer}
    password: ${SPRING_DATASOURCE_PASSWORD:money_transfer_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
